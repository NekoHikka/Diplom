<div class="card" style="flex: 1; min-width: 300px">
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
      flex-wrap: wrap;
    "
  >
    <h3 style="margin: 0; white-space: nowrap; font-size: 1.1rem">
      <span class="title-icon" aria-hidden="true" style="color:#4db8ff;">
        <svg viewBox="0 0 24 24">
          <path d="M4 7h16v10H4z"></path>
          <path d="M7 11h3"></path>
          <path d="M7 14h6"></path>
          <path d="M7 4.5V7"></path>
          <path d="M17 4.5V7"></path>
        </svg>
      </span>{{ get_string('accounts') }}
    </h3>
    <span
      style="
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
        color: #4caf50;
      "
      >{{ get_string('total_balance') }}: {{ balance }} {{
      get_string('currency') }}</span
    >
  </div>
  <div
    style="
      max-height: 150px;
      overflow-y: auto;
      padding-right: 5px;
      margin-bottom: 15px;
    "
  >
    {% for acc in accounts %}
    <div
      class="pdf-account-row"
      data-name="{{ translate_name(acc.name)|e }}"
      data-balance="{{ acc.balance }} {{ get_string('currency') }}"
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        background-color: var(--input-bg);
        margin-bottom: 8px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        gap: 10px;
      "
    >
      <strong
        style="
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          max-width: 50%;
        "
        >
          <span class="item-with-icon" style="color:#ff9800;">
            {{ render_item_icon(acc.name, 'card') }}
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-color);">{{ translate_name(acc.name) }}</span>
          </span>
        </strong
      >
      <div
        style="display: flex; align-items: center; gap: 12px; flex-shrink: 0"
      >
        <span style="font-weight: bold; color: #4db8ff; white-space: nowrap"
          >{{ acc.balance }} {{ get_string('currency') }}</span
        >
        <span class="no-print" style="white-space: nowrap">
          <a
            href="{{ url_for('budget.edit_account', id=acc.id) }}"
            style="text-decoration: none; margin-right: 5px"
            ><span class="action-icon" aria-hidden="true" style="width:14px;height:14px;color:currentColor;display:inline-flex;vertical-align:middle;"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"></path><path d="M13 7l4 4"></path></svg></span></a
          >
          <a
            href="{{ url_for('budget.delete_account_route', id=acc.id) }}"
            style="text-decoration: none"
            class="optimistic-delete"
            data-confirm-message="{{ get_string('delete') }} {{ get_string('acc_label')|lower }}?"
            data-confirm-title="{{ get_string('delete') }} {{ get_string('acc_label')|lower }}"
            data-confirm-ok="{{ get_string('delete') }}"
            data-confirm-cancel="{{ get_string('cancel') }}"
            ><span class="action-icon" aria-hidden="true" style="width:14px;height:14px;color:currentColor;display:inline-flex;vertical-align:middle;"><svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></span></a
          >
        </span>
      </div>
    </div>
    {% endfor %}
  </div>

  <form
    action="{{ url_for('budget.add_account_route') }}"
    method="POST"
    class="no-print"
    style="display: flex; gap: 8px"
  >
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <input
      type="hidden"
      name="is_shared"
      value="{{ 'true' if is_shared_view else 'false' }}"
    />
    <div class="icon-picker" data-icons='{{ icon_choices("account") | tojson }}' style="width: 86px; flex-shrink: 0;">
      <input class="icon-picker-input" type="hidden" name="emoji" value="icon:card" />
      <button type="button" class="icon-picker-trigger" aria-label="Choose account icon">
        <span class="icon-picker-current item-icon"></span>
        <svg class="icon-picker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <div class="icon-picker-panel">
        <input class="icon-picker-search" type="text" placeholder="Search" />
        <div class="icon-picker-grid"></div>
      </div>
    </div>
    <input
      type="text"
      name="name"
      placeholder="{{ get_string('acc_name_ph') }}"
      required
      maxlength="24"
      pattern=".*\S+.*"
      title="Введіть назву без пустих пробілів"
      style="flex: 2; padding: 8px"
    />
    <input
      type="text"
      inputmode="decimal"
      name="balance"
      placeholder="{{ get_string('acc_balance_ph') }}"
      style="flex: 1; padding: 8px; min-width: 60px"
      oninput="formatMoneyInput(this)"
    />
    <button
      type="submit"
      class="btn optimistic-submit"
      style="
        background-color: #ff9800;
        color: white;
        padding: 8px;
        flex-shrink: 0;
      "
    >
      +
    </button>
  </form>
</div>
