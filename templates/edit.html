{% extends "base.html" %}

{% block title %}{{ get_string('edit_record') }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto">
  <h2 style="margin-top: 0; color: #4caf50">{{ get_string('edit_record') }}</h2>
  <form action="{{ url_for('budget.edit_transaction_route', id=t.id) }}" method="POST" style="display: flex; flex-direction: column; gap: 15px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    
    <div style="display: flex; gap: 10px">
      <div style="flex: 1">
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('type') }}:</label>
        <select name="type" id="type_select" onchange="updateCategories()">
          <option value="Витрата" {% if t.type == 'Витрата' %}selected{% endif %}>{{ get_string('expense') }}</option>
          <option value="Дохід" {% if t.type == 'Дохід' %}selected{% endif %}>{{ get_string('income') }}</option>
        </select>
      </div>
      <div style="flex: 1">
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('acc_label') }}:</label>
        <select name="account_id">
          {% for acc in accounts %}
          <option value="{{ acc.id }}" {% if t.account_id == acc.id %}selected{% endif %}>{{ translate_name(acc.name) }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('category') }}:</label>
      <select name="category" id="category_select" data-icon-select></select>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex: 1">
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('amount') }}:</label>
        <input type="text" inputmode="decimal" name="amount" value="{{ t.amount if t.amount % 1 != 0 else t.amount|int }}" required oninput="formatMoneyInput(this)" />
      </div>
      <div style="flex: 1">
        <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('date') }}:</label>
        <input type="date" name="date" value="{{ t.date.strftime('%Y-%m-%d') }}" required />
      </div>
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('description') }}:</label>
      <input type="text" name="description" value="{{ t.description }}" />
    </div>

    <div style="display: flex; gap: 10px; margin-top: 10px">
      <button type="submit" class="btn" style="background-color: #4caf50; color: white; flex: 1">{{ get_string('save') }}</button>
      <a href="{{ url_for('shared.shared_budget' if t.is_shared else 'budget.home') }}" class="btn" style="background-color: #666; color: white; flex: 1">{{ get_string('cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  const expenseCategories = {{ exp_cat_options | default([], true) | tojson | safe }};
  const incomeCategories = {{ inc_cat_options | default([], true) | tojson | safe }};
  const currentCat = {{ t.category | tojson }};

  function updateCategories() {
    const selectedType = document.getElementById("type_select").value;
    const catObj = document.getElementById("category_select");
    catObj.innerHTML = "";
    (selectedType === "Витрата" ? expenseCategories : incomeCategories).forEach(cat => {
      let opt = document.createElement("option");
      opt.value = cat.value;
      opt.textContent = cat.label;
      opt.dataset.iconValue = cat.value;
      if(cat.value === currentCat) opt.selected = true;
      catObj.appendChild(opt);
    });
    catObj.dispatchEvent(new Event("change", { bubbles: true }));
  }
  updateCategories();
  document.addEventListener("DOMContentLoaded", initIconSelects);
</script>
{% endblock %}
