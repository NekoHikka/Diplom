{% extends "base.html" %}

{% block title %}{{ get_string('edit_account') }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto">
  <h2 style="margin-top: 0; color: #ff9800">{{ get_string('edit_account') }}</h2>
  <form action="{{ url_for('budget.edit_account', id=acc.id) }}" method="POST" style="display: flex; flex-direction: column; gap: 15px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    
    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('type') }}:</label>
      <div class="icon-picker" data-icons='{{ icon_choices("account") | tojson }}' style="max-width: 120px;">
        <input class="icon-picker-input" type="hidden" name="emoji" value="{{ current_emoji }}" />
        <button type="button" class="icon-picker-trigger" aria-label="Choose account icon">
          <span class="icon-picker-current item-icon"></span>
          <svg class="icon-picker-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <div class="icon-picker-panel">
          <input class="icon-picker-search" type="text" placeholder="Search" />
          <div class="icon-picker-grid"></div>
        </div>
      </div>
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('ph_name')|replace('(','')|replace(')','') }}:</label>
      <input type="text" name="name" value="{{ current_name }}" required />
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('amount') }}:</label>
      <input type="text" inputmode="decimal" name="balance" value="{{ acc.balance if acc.balance % 1 != 0 else acc.balance|int }}" required oninput="formatMoneyInput(this)" />
    </div>

    <div style="display: flex; gap: 10px; margin-top: 10px">
      <button type="submit" class="btn" style="background-color: #4caf50; color: white; flex: 1">{{ get_string('save') }}</button>
      <a href="{{ url_for('shared.shared_budget' if acc.is_shared else 'budget.home') }}" class="btn" style="background-color: #666; color: white; flex: 1">{{ get_string('cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}
