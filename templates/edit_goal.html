{% extends "base.html" %}

{% block title %}{{ get_string('edit_goal') }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto">
  <h2 style="margin-top: 0; color: #2196f3">{{ get_string('edit_goal') }}</h2>
  <form action="{{ url_for('budget.edit_goal_route', id=g.id) }}" method="POST" style="display: flex; flex-direction: column; gap: 15px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    
    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('ph_name')|replace('(','')|replace(')','') }}:</label>
      <input type="text" name="name" value="{{ g.name }}" required />
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('amount') }}:</label>
      <input type="text" inputmode="decimal" name="target_amount" value="{{ g.target_amount if g.target_amount % 1 != 0 else g.target_amount|int }}" required oninput="formatMoneyInput(this)" />
    </div>

    <div>
      <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #aaa">{{ get_string('calc_from_accs') }}:</label>
      <div id="goal-pills" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px">
        <label class="acc-pill {% if not selected_ids %}active{% endif %}">
          <input type="checkbox" name="account_ids" value="all" {% if not selected_ids %}checked{% endif %} style="display: none" />
          {{ get_string('all_accs_pill') }}
        </label>
        {% for acc in accounts %}
        <label class="acc-pill {% if acc.id in selected_ids %}active{% endif %}">
          <input type="checkbox" name="account_ids" value="{{ acc.id }}" {% if acc.id in selected_ids %}checked{% endif %} style="display: none" />
          {{ translate_name(acc.name) }}
        </label>
        {% endfor %}
      </div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 10px">
      <button type="submit" class="btn" style="background-color: #4caf50; color: white; flex: 1">{{ get_string('save') }}</button>
      <a href="{{ url_for('shared.shared_budget' if g.is_shared else 'budget.home') }}" class="btn" style="background-color: #666; color: white; flex: 1">{{ get_string('cancel') }}</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    const pillsContainer = document.getElementById('goal-pills');
    if (pillsContainer) {
        const pills = pillsContainer.querySelectorAll('.acc-pill');
        const allPillLabel = pillsContainer.querySelector('input[value="all"]').parentElement;
        const allPillInput = pillsContainer.querySelector('input[value="all"]');

        pills.forEach(pill => {
            const checkbox = pill.querySelector('input');
            pill.addEventListener('click', (e) => {
                e.preventDefault();
                if (checkbox.value === 'all') {
                    pills.forEach(p => { p.classList.remove('active'); p.querySelector('input').checked = false; });
                    pill.classList.add('active'); checkbox.checked = true;
                } else {
                    allPillLabel.classList.remove('active'); allPillInput.checked = false;
                    checkbox.checked = !checkbox.checked;
                    if (checkbox.checked) pill.classList.add('active'); else pill.classList.remove('active');
                    if (!Array.from(pills).some(p => p.querySelector('input').checked)) {
                        allPillLabel.classList.add('active'); allPillInput.checked = true;
                    }
                }
            });
        });
    }
</script>
{% endblock %}
