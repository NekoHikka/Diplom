<!doctype html>
<html lang="{{ session.get('lang', 'uk') }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ get_string('forgot_password_title') }}</title>
    {% include "partials/favicon.html" %}
    <style>
      :root { --bg: #121212; --card: #1e1e1e; --text: #fff; --primary: #4caf50; }
      body { background: var(--bg); color: var(--text); font-family: Arial; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
      .card { background: var(--card); padding: 30px; border-radius: 12px; width: 100%; max-width: 350px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
      input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
      .btn { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
      .hint { color: #aaa; font-size: 14px; line-height: 1.45; text-align: center; margin: 0 0 12px; }
      .link { text-align: center; margin-top: 15px; font-size: 14px; }
      a { color: var(--primary); text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="display: flex; justify-content: flex-end; margin-bottom: -10px">
        <a href="{{ url_for('auth.set_lang', lang='uk') if session.get('lang', 'uk') == 'en' else url_for('auth.set_lang', lang='en') }}" style="font-size: 12px; opacity: 0.7; color: var(--text)">
          {{ get_string('nav_lang_btn') }}
        </a>
      </div>
      <h2 style="text-align: center; margin-top: 0">{{ get_string('forgot_password_title') }}</h2>
      <p class="hint">{{ get_string('forgot_password_hint') }}</p>
      <p class="hint">{{ get_string('email_spam_hint') }}</p>
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="email" name="email" value="{{ email_value or '' }}" placeholder="{{ get_string('email_label') }}" maxlength="120" required />
        <button type="submit" class="btn">{{ get_string('send_code_btn') }}</button>
      </form>
      <div class="link">
        <a href="{{ url_for('auth.login') }}">{{ get_string('login_btn') }}</a>
      </div>
    </div>
  </body>
</html>
